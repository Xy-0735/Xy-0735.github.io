<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI导航 · 发现全球智能应用与API平台</title>
  <style>
    :root {
      /* 杂志风+自然系配色 */
      --bg: #faf9f7;
      --card-bg: #ffffff;
      --card-hover: #f5f4f2;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --text-tertiary: #999999;
      --border: #e8e6e3;
      --border-light: #f0eeeb;
      
      /* 品牌色系 - 森林绿+琥珀金 */
      --accent: #2d5a47;
      --accent-light: #e8f0ed;
      --accent-hover: #234539;
      --gold: #d4a574;
      --gold-light: #faf4ef;
      --coral: #e07a5f;
      --coral-light: #fef0ed;
      
      /* 标签色 */
      --tag-bg: #f5f4f2;
      --tag-text: #555555;
      --free-bg: #e8f5e9;
      --free-text: #2e7d32;
      --paid-bg: #fff8e1;
      --paid-text: #f57f17;
      --partial-bg: #e3f2fd;
      --partial-text: #1565c0;
      
      /* 区域标签 */
      --domestic-bg: #fce4ec;
      --domestic-text: #c2185b;
      --overseas-bg: #e8eaf6;
      --overseas-text: #3949ab;
      --nomagic-bg: #e8f5e9;
      --nomagic-text: #2e7d32;
      --partial-region-bg: #fff3e0;
      --partial-region-text: #e65100;
      
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html { scroll-behavior: smooth; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 头部 - 紧凑设计 */
    .header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--accent);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .logo-text h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }
    .logo-text span {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      font-weight: 400;
    }
    .header-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-search {
      position: relative;
      min-width: 180px;
      max-width: 260px;
    }
    .header-search .search-input {
      width: 100%;
      padding: 7px 14px 7px 34px;
      border-radius: 20px;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      outline: none;
      background: var(--bg);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .header-search .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(45,90,71,0.1);
    }
    .header-search .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.85rem;
      pointer-events: none;
    }
    .model-count {
      background: var(--gold-light);
      color: var(--gold);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .filter-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .filter-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .filter-toggle.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Tab切换栏 */
    .tab-bar {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
    }
    .tab-bar-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      gap: 0;
    }
    .tab-btn {
      padding: 14px 28px;
      border: none;
      background: transparent;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      position: relative;
      transition: color 0.25s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tab-btn::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 3px;
      background: var(--accent);
      border-radius: 3px 3px 0 0;
      transition: width 0.25s ease;
    }
    .tab-btn:hover {
      color: var(--accent);
    }
    .tab-btn.active {
      color: var(--accent);
    }
    .tab-btn.active::after {
      width: 60%;
    }
    .tab-btn .tab-icon {
      font-size: 1.1rem;
    }

    /* 浮动筛选栏 */
    .filter-bar {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      position: sticky;
      top: 73px;
      z-index: 90;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .filter-bar.hidden {
      transform: translateY(-100%);
      opacity: 0;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
    }
    .filter-bar-inner {
      max-width: 1400px;
      margin: 0 auto;
    }
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 20px;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .filter-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .filter-btn {
      padding: 5px 12px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      transition: all 0.2s;
      white-space: nowrap;
    }
    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-light);
    }
    .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* 内容区域 */
    .content-section {
      display: none;
      transition: opacity 0.3s ease;
    }
    .content-section.active {
      display: block;
    }

    /* 主容器 */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }

    /* 工具栏 */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .result-info {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .result-info strong {
      color: var(--accent);
      font-weight: 700;
    }
    .reset-link {
      font-size: 0.8rem;
      color: var(--coral);
      text-decoration: none;
      cursor: pointer;
      font-weight: 500;
    }
    .reset-link:hover {
      text-decoration: underline;
    }

    /* 网格布局 */
    .model-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    /* 卡片设计 */
    .model-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 20px;
      border: 1px solid var(--border-light);
      transition: all 0.25s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .model-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--card-accent, var(--accent));
      opacity: 0;
      transition: opacity 0.25s;
    }
    .model-card:hover {
      border-color: var(--border);
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }
    .model-card:hover::before {
      opacity: 1;
    }
    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 12px;
    }
    .model-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      color: #fff;
    }
    .card-info {
      flex: 1;
      min-width: 0;
    }
    .model-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 2px;
    }
    .company {
      font-size: 0.78rem;
      color: var(--text-tertiary);
    }
    .desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 14px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .tag {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .tag-type { background: var(--tag-bg); color: var(--tag-text); }
    .tag-free { background: var(--free-bg); color: var(--free-text); }
    .tag-paid { background: var(--paid-bg); color: var(--paid-text); }
    .tag-partial { background: var(--partial-bg); color: var(--partial-text); }
    .tag-domestic { background: var(--domestic-bg); color: var(--domestic-text); }
    .tag-overseas { background: var(--overseas-bg); color: var(--overseas-text); }
    .tag-nomagic { background: var(--nomagic-bg); color: var(--nomagic-text); }
    .tag-partial-region { background: var(--partial-region-bg); color: var(--partial-region-text); }
    
    .card-footer {
      display: flex;
      gap: 8px;
      padding-top: 14px;
      border-top: 1px solid var(--border-light);
      margin-top: auto;
    }
    .btn {
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      flex: 1;
      justify-content: center;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .btn-outline {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .btn-outline:hover {
      background: var(--accent-light);
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-tertiary);
      display: none;
    }
    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    /* 返回顶部按钮 */
    .back-to-top {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: all 0.3s ease;
      z-index: 80;
    }
    .back-to-top.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .back-to-top:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    /* 底部 */
    .footer {
      text-align: center;
      padding: 40px 24px;
      color: var(--text-tertiary);
      font-size: 0.8rem;
      border-top: 1px solid var(--border-light);
      margin-top: 40px;
    }
    .footer-note {
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* 移动端适配 */
    @media (max-width: 768px) {
      .header {
        padding: 12px 16px;
      }
      .header-meta {
        gap: 8px;
      }
      .model-count {
        display: none;
      }
      .tab-bar {
        padding: 0 16px;
        overflow-x: auto;
      }
      .tab-bar-inner {
        gap: 0;
      }
      .tab-btn {
        padding: 12px 16px;
        font-size: 0.85rem;
        white-space: nowrap;
      }
      .filter-bar {
        top: 61px;
        padding: 12px 16px;
      }
      .filter-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .filter-group {
        width: 100%;
      }
      .filter-buttons {
        width: 100%;
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: 4px;
      }
      .filter-btn {
        flex-shrink: 0;
      }
      .header-search {
        min-width: 0;
        max-width: 100%;
        width: 100%;
        order: 10;
      }
      .header-search .search-input {
        width: 100%;
      }
      .container {
        padding: 16px;
      }
      .model-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .model-card {
        padding: 16px;
      }
      .back-to-top {
        bottom: 16px;
        right: 16px;
        width: 44px;
        height: 44px;
      }
    }

    /* 动画 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .model-card {
      animation: fadeIn 0.3s ease forwards;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">🧭</div>
        <div class="logo-text">
          <h1>AI导航</h1>
          <span>发现全球智能应用</span>
        </div>
      </div>
      <div class="header-meta">
        <div class="header-search">
          <span class="search-icon">🔎</span>
          <input type="text" class="search-input" id="searchInputHeader" placeholder="搜索名称、公司...">
        </div>
        <span class="model-count" id="totalBadge">收录 <strong>0</strong> 款</span>
        <button class="filter-toggle active" id="filterToggle">
          <span>🔍</span> 筛选器
        </button>
      </div>
    </div>
  </header>

  <!-- Tab切换栏 -->
  <div class="tab-bar">
    <div class="tab-bar-inner">
      <button class="tab-btn active" data-tab="tools">
        <span class="tab-icon">🛠️</span> AI工具集
      </button>
      <button class="tab-btn" data-tab="api">
        <span class="tab-icon">⚡</span> API平台
      </button>
    </div>
  </div>

  <!-- AI工具集筛选器 -->
  <div class="filter-bar" id="toolsFilterBar">
    <div class="filter-bar-inner">
      <div class="filter-row">
        <div class="filter-group">
          <span class="filter-label">📂 类型</span>
          <div class="filter-buttons" id="toolsTypeFilters">
            <button class="filter-btn active" data-type="all">全部</button>
            <button class="filter-btn" data-type="文本">📝 文本</button>
            <button class="filter-btn" data-type="编程">💻 编程</button>
            <button class="filter-btn" data-type="图像">🎨 图像</button>
            <button class="filter-btn" data-type="视频">🎬 视频</button>
            <button class="filter-btn" data-type="音频">🎵 音频</button>
            <button class="filter-btn" data-type="搜索">🔍 搜索</button>
            <button class="filter-btn" data-type="智能体">🤖 智能体</button>
            <button class="filter-btn" data-type="3D">🎲 3D</button>
            <button class="filter-btn" data-type="办公">📄 办公</button>
          </div>
        </div>
        <div class="filter-group">
          <span class="filter-label">💰 费用</span>
          <div class="filter-buttons" id="toolsPriceFilters">
            <button class="filter-btn active" data-price="all">全部</button>
            <button class="filter-btn" data-price="免费">🆓 免费</button>
            <button class="filter-btn" data-price="部分免费">🟡 部分免费</button>
            <button class="filter-btn" data-price="付费">💎 付费</button>
          </div>
        </div>
        <div class="filter-group">
          <span class="filter-label">🌍 访问</span>
          <div class="filter-buttons" id="toolsRegionFilters">
            <button class="filter-btn active" data-region="all">全部</button>
            <button class="filter-btn" data-region="国内无需魔法">🇨🇳 国内直连</button>
            <button class="filter-btn" data-region="国外需要魔法">🌐 需魔法</button>
            <button class="filter-btn" data-region="部分受限">⚠️ 部分受限</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- API平台筛选器 -->
  <div class="filter-bar" id="apiFilterBar" style="display:none;">
    <div class="filter-bar-inner">
      <div class="filter-row">
        <div class="filter-group">
          <span class="filter-label">📂 类型</span>
          <div class="filter-buttons" id="apiTypeFilters">
            <button class="filter-btn active" data-type="all">全部</button>
            <button class="filter-btn" data-type="文本生成">📝 文本生成</button>
            <button class="filter-btn" data-type="代码生成">💻 代码生成</button>
            <button class="filter-btn" data-type="图像生成">🎨 图像生成</button>
            <button class="filter-btn" data-type="视频生成">🎬 视频生成</button>
            <button class="filter-btn" data-type="音频生成">🎵 音频生成</button>
            <button class="filter-btn" data-type="嵌入/向量化">🔢 嵌入/向量化</button>
            <button class="filter-btn" data-type="多模态">✨ 多模态</button>
            <button class="filter-btn" data-type="聚合/路由">🔄 聚合/路由</button>
          </div>
        </div>
        <div class="filter-group">
          <span class="filter-label">💰 费用</span>
          <div class="filter-buttons" id="apiPriceFilters">
            <button class="filter-btn active" data-price="all">全部</button>
            <button class="filter-btn" data-price="免费">🆓 免费</button>
            <button class="filter-btn" data-price="部分免费">🟡 部分免费</button>
            <button class="filter-btn" data-price="付费">💎 付费</button>
          </div>
        </div>
        <div class="filter-group">
          <span class="filter-label">🌍 访问</span>
          <div class="filter-buttons" id="apiRegionFilters">
            <button class="filter-btn active" data-region="all">全部</button>
            <button class="filter-btn" data-region="国内无需魔法">🇨🇳 国内直连</button>
            <button class="filter-btn" data-region="国外需要魔法">🌐 需魔法</button>
            <button class="filter-btn" data-region="部分受限">⚠️ 部分受限</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- AI工具集内容 -->
  <div class="content-section active" id="toolsSection">
    <div class="container">
      <div class="toolbar">
        <span class="result-info" id="toolsResultCount">显示 <strong>0</strong> 个结果</span>
        <a class="reset-link" id="toolsResetBtn">↺ 重置筛选</a>
      </div>
      <div class="model-grid" id="toolsModelGrid"></div>
      <div class="empty-state" id="toolsEmptyState">
        <div class="empty-state-icon">🔍</div>
        <p>没有匹配的AI工具，试试其他条件</p>
      </div>
    </div>
  </div>

  <!-- API平台内容 -->
  <div class="content-section" id="apiSection">
    <div class="container">
      <div class="toolbar">
        <span class="result-info" id="apiResultCount">显示 <strong>0</strong> 个结果</span>
        <a class="reset-link" id="apiResetBtn">↺ 重置筛选</a>
      </div>
      <div class="model-grid" id="apiModelGrid"></div>

      // ========== 状态 ==========
      let activeTab = 'tools';
      let toolsActiveType = 'all';
      let toolsActivePrice = 'all';
      let toolsActiveRegion = 'all';
      let apiActiveType = 'all';
      let apiActivePrice = 'all';
      let apiActiveRegion = 'all';
      let searchQuery = '';
      let filterVisible = true;
      let lastScrollY = 0;

      // ========== 元素 ==========
      const filterToggle = document.getElementById('filterToggle');
      const backToTop = document.getElementById('backToTop');
      const toolsFilterBar = document.getElementById('toolsFilterBar');
      const apiFilterBar = document.getElementById('apiFilterBar');
      const toolsSection = document.getElementById('toolsSection');
      const apiSection = document.getElementById('apiSection');
      const tabBtns = document.querySelectorAll('.tab-btn');

      // ========== 更新徽章 ==========
      function updateTotalBadge() {
        const count = activeTab === 'tools' ? tools.length : apiPlatforms.length;
        document.getElementById('totalBadge').innerHTML = '收录 <strong>' + count + '</strong> 款';
      }

      // ========== Tab切换 ==========
      function switchTab(tab) {
        activeTab = tab;
        
        // 更新Tab按钮状态
        tabBtns.forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
        });
        
        // 切换内容区域
        toolsSection.classList.toggle('active', tab === 'tools');
        apiSection.classList.toggle('active', tab === 'api');
        
        // 切换筛选器
        toolsFilterBar.style.display = tab === 'tools' ? 'block' : 'none';
        apiFilterBar.style.display = tab === 'api' ? 'block' : 'none';
        
        // 更新徽章
        updateTotalBadge();
        
        // 渲染对应内容
        if (tab === 'tools') {
          renderToolsGrid();
        } else {
          renderApiGrid();
        }
      }

      tabBtns.forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.getAttribute('data-tab')));
      });

      // ========== 筛选工具数据 ==========
      function filterToolsData() {
        return tools.filter(m => {
          if (toolsActiveType !== 'all' && !m.types.includes(toolsActiveType)) return false;
          if (toolsActivePrice !== 'all' && m.price !== toolsActivePrice) return false;
          if (toolsActiveRegion !== 'all' && m.region !== toolsActiveRegion) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.trim().toLowerCase();
            const haystack = (m.name + ' ' + m.company + ' ' + m.desc + ' ' + m.types.join(' ')).toLowerCase();
            if (!haystack.includes(q)) return false;
          }
          return true;
        });
      }

      // ========== 筛选API数据 ==========
      function filterApiData() {
        return apiPlatforms.filter(m => {
          if (apiActiveType !== 'all' && !m.types.includes(apiActiveType)) return false;
          if (apiActivePrice !== 'all' && m.price !== apiActivePrice) return false;
          if (apiActiveRegion !== 'all' && m.region !== apiActiveRegion) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.trim().toLowerCase();
            const haystack = (m.name + ' ' + m.company + ' ' + m.desc + ' ' + m.types.join(' ')).toLowerCase();
            if (!haystack.includes(q)) return false;
          }
          return true;
        });
      }

      // ========== 渲染工具网格 ==========
      function renderToolsGrid() {
        const filtered = filterToolsData();
        const grid = document.getElementById('toolsModelGrid');
        const empty = document.getElementById('toolsEmptyState');
        const countSpan = document.getElementById('toolsResultCount');
        countSpan.innerHTML = '显示 <strong>' + filtered.length + '</strong> 个结果 <span style="color:var(--text-tertiary)">（共 ' + tools.length + ' 个）</span>';

        if (filtered.length === 0) {
          grid.innerHTML = '';
          empty.style.display = 'block';
        } else {
          empty.style.display = 'none';
          grid.innerHTML = filtered.map((m, i) => {
            const iconColor = m.color || '#2d5a47';
            const typeTags = m.types.map(t => `<span class="tag tag-type">${t}</span>`).join('');
            let priceTag = '';
            if (m.price === '免费') priceTag = '<span class="tag tag-free">🆓 免费</span>';
            else if (m.price === '部分免费') priceTag = '<span class="tag tag-paid">🟡 部分免费</span>';
            else priceTag = '<span class="tag tag-paid">💎 付费</span>';

            let regionTag = '';
            if (m.region === '国内无需魔法') regionTag = '<span class="tag tag-nomagic">🇨🇳 国内直连</span>';
            else if (m.region === '国外需要魔法') regionTag = '<span class="tag tag-overseas">🌐 需魔法</span>';
            else regionTag = '<span class="tag tag-partial-region">⚠️ 部分受限</span>';

            const apiBtn = m.api ? `<a href="${m.api}" target="_blank" class="btn btn-outline" onclick="event.stopPropagation()">⚙️ API</a>` : '';
            return `
              <div class="model-card" style="--card-accent:${iconColor};animation-delay:${i * 0.03}s" onclick="window.open('${m.url}','_blank')" title="访问 ${m.name}">
                <div class="card-top">
                  <div class="model-icon" style="background:${iconColor}">${m.icon}</div>
                  <div class="card-info">
                    <div class="model-name">${m.name}</div>
                    <div class="company">${m.company}</div>
                  </div>
                </div>
                <div class="desc">${m.desc}</div>
                <div class="tags">${typeTags}${priceTag}${regionTag}</div>
                <div class="card-footer">
                  <a href="${m.url}" target="_blank" class="btn btn-primary" onclick="event.stopPropagation()">🌐 官网</a>
                  ${apiBtn}
                </div>
              </div>
            `;
          }).join('');
        }
      }

      // ========== 渲染API网格 ==========
      function renderApiGrid() {
        const filtered = filterApiData();
        const grid = document.getElementById('apiModelGrid');
        const empty = document.getElementById('apiEmptyState');
        const countSpan = document.getElementById('apiResultCount');
        countSpan.innerHTML = '显示 <strong>' + filtered.length + '</strong> 个结果 <span style="color:var(--text-tertiary)">（共 ' + apiPlatforms.length + ' 个）</span>';

        if (filtered.length === 0) {
          grid.innerHTML = '';
          empty.style.display = 'block';
        } else {
          empty.style.display = 'none';
          grid.innerHTML = filtered.map((m, i) => {
            const iconColor = m.color || '#2d5a47';
            const typeTags = m.types.map(t => `<span class="tag tag-type">${t}</span>`).join('');
            let priceTag = '';
            if (m.price === '免费') priceTag = '<span class="tag tag-free">🆓 免费</span>';
            else if (m.price === '部分免费') priceTag = '<span class="tag tag-paid">🟡 部分免费</span>';
            else priceTag = '<span class="tag tag-paid">💎 付费</span>';

            let regionTag = '';
            if (m.region === '国内无需魔法') regionTag = '<span class="tag tag-nomagic">🇨🇳 国内直连</span>';
            else if (m.region === '国外需要魔法') regionTag = '<span class="tag tag-overseas">🌐 需魔法</span>';
            else regionTag = '<span class="tag tag-partial-region">⚠️ 部分受限</span>';

            return `
              <div class="model-card" style="--card-accent:${iconColor};animation-delay:${i * 0.03}s" onclick="window.open('${m.url}','_blank')" title="访问 ${m.name}">
                <div class="card-top">
                  <div class="model-icon" style="background:${iconColor}">${m.icon}</div>
                  <div class="card-info">
                    <div class="model-name">${m.name}</div>
                    <div class="company">${m.company}</div>
                  </div>
                </div>
                <div class="desc">${m.desc}</div>
                <div class="tags">${typeTags}${priceTag}${regionTag}</div>
                <div class="card-footer">
                  <a href="${m.url}" target="_blank" class="btn btn-primary" onclick="event.stopPropagation()">🌐 官网</a>
                  <a href="${m.docs}" target="_blank" class="btn btn-outline" onclick="event.stopPropagation()">📖 文档</a>
                </div>
              </div>
            `;
          }).join('');
        }
      }

      // ========== 绑定工具筛选器 ==========
      function bindToolsFilters() {
        document.getElementById('toolsTypeFilters').addEventListener('click', e => {
          if (e.target.classList.contains('filter-btn')) {
            toolsActiveType = e.target.getAttribute('data-type');
            updateActiveButtons('toolsTypeFilters', 'data-type', toolsActiveType);
            renderToolsGrid();
          }
        });
        document.getElementById('toolsPriceFilters').addEventListener('click', e => {
          if (e.target.classList.contains('filter-btn')) {
            toolsActivePrice = e.target.getAttribute('data-price');
            updateActiveButtons('toolsPriceFilters', 'data-price', toolsActivePrice);
            renderToolsGrid();
          }
        });
        document.getElementById('toolsRegionFilters').addEventListener('click', e => {
          if (e.target.classList.contains('filter-btn')) {
            toolsActiveRegion = e.target.getAttribute('data-region');
            updateActiveButtons('toolsRegionFilters', 'data-region', toolsActiveRegion);
            renderToolsGrid();
          }
        });
      }

      // ========== 绑定API筛选器 ==========
      function bindApiFilters() {
        document.getElementById('apiTypeFilters').addEventListener('click', e => {
          if (e.target.classList.contains('filter-btn')) {
            apiActiveType = e.target.getAttribute('data-type');
            updateActiveButtons('apiTypeFilters', 'data-type', apiActiveType);
            renderApiGrid();
          }
        });
        document.getElementById('apiPriceFilters').addEventListener('click', e => {
          if (e.target.classList.contains('filter-btn')) {
            apiActivePrice = e.target.getAttribute('data-price');
            updateActiveButtons('apiPriceFilters', 'data-price', apiActivePrice);
            renderApiGrid();
          }
        });
        document.getElementById('apiRegionFilters').addEventListener('click', e => {
          if (e.target.classList.contains('filter-btn')) {
            apiActiveRegion = e.target.getAttribute('data-region');
            updateActiveButtons('apiRegionFilters', 'data-region', apiActiveRegion);
            renderApiGrid();
          }
        });
      }

      function updateActiveButtons(containerId, attr, value) {
        document.querySelectorAll(`#${containerId} .filter-btn`).forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute(attr) === value);
        });
      }

      // ========== 搜索 ==========
      const searchInputHeader = document.getElementById('searchInputHeader');
      searchInputHeader.addEventListener('input', function(e) {
        searchQuery = e.target.value;
        if (activeTab === 'tools') {
          renderToolsGrid();
        } else {
          renderApiGrid();
        }
      });

      // ========== 重置工具 ==========
      document.getElementById('toolsResetBtn').addEventListener('click', () => {
        toolsActiveType = 'all';
        toolsActivePrice = 'all';
        toolsActiveRegion = 'all';
        searchQuery = '';
        searchInputHeader.value = '';
        updateActiveButtons('toolsTypeFilters','data-type','all');
        updateActiveButtons('toolsPriceFilters','data-price','all');
        updateActiveButtons('toolsRegionFilters','data-region','all');
        renderToolsGrid();
      });

      // ========== 重置API ==========
      document.getElementById('apiResetBtn').addEventListener('click', () => {
        apiActiveType = 'all';
        apiActivePrice = 'all';
        apiActiveRegion = 'all';
        searchQuery = '';
        searchInputHeader.value = '';
        updateActiveButtons('apiTypeFilters','data-type','all');
        updateActiveButtons('apiPriceFilters','data-price','all');
        updateActiveButtons('apiRegionFilters','data-region','all');
        renderApiGrid();
      });

      // ========== 筛选器显示/隐藏 ==========
      filterToggle.addEventListener('click', () => {
        filterVisible = !filterVisible;
        if (activeTab === 'tools') {
          toolsFilterBar.style.display = filterVisible ? 'block' : 'none';
        } else {
          apiFilterBar.style.display = filterVisible ? 'block' : 'none';
        }
        filterToggle.classList.toggle('active', filterVisible);
      });

      // ========== 返回顶部 ==========
      function handleScroll() {
        const scrollY = window.scrollY;
        
        if (scrollY > 400) {
          backToTop.classList.add('visible');
        } else {
          backToTop.classList.remove('visible');
        }
        
        lastScrollY = scrollY;
      }

      backToTop.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      window.addEventListener('scroll', handleScroll, { passive: true });

      // ========== 初始化 ==========
      bindToolsFilters();
      bindApiFilters();

      updateTotalBadge();
      renderToolsGrid();
      renderApiGrid();
    })();
  </script>
